name: Watchtower report
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Only run specs under this path (e.g. tests/checkout)"
        required: false
        default: ""
      grep:
        description: "Only run tests whose title matches this pattern"
        required: false
        default: ""
jobs:
  test-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # No committed lockfile (this repo is a bag of test sub-projects, not a
      # single Node app), so install rather than `npm ci`, and skip npm cache
      # (its key needs a lockfile).
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          PATROL_GREP: ${{ inputs.grep }}
        # The dashboard's `path` input carries Cypress-style globs the root
        # Playwright project can't run, so run the root e2e suite and let grep
        # narrow it. Produces a JSON report for the ingest step below.
        run: npx playwright test ${PATROL_GREP:+--grep "$PATROL_GREP"} --reporter=json > report.json || true
      - name: Report to Watchtower
        if: always()
        run: |
          test -s report.json || { echo "::error::empty report"; exit 1; }
          # Retry the upload: a single 429/blip from the dashboard host must not
          # lose a finished report (#133).
          status=$(curl --silent --show-error --output response.txt --write-out "%{http_code}" \
            --retry 5 --retry-all-errors --retry-delay 10 \
            -X POST "${{ secrets.WATCHTOWER_INGEST_URL }}" \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_INGEST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "X-Watchtower-Repo: ${{ github.repository }}" \
            -H "X-Watchtower-Branch: ${{ github.ref_name }}" \
            -H "X-Watchtower-Commit: ${{ github.sha }}" \
            -H "X-Watchtower-Suite: ${{ inputs.path }}" \
            --data @report.json) || true
          case "$status" in
            2??) echo "Report ingested (HTTP $status)" ;;
            *)
              echo "::error::report upload failed after retries (HTTP ${status:-none})"
              [ -s response.txt ] && { echo "Response body:"; cat response.txt; }
              exit 1
              ;;
          esac
